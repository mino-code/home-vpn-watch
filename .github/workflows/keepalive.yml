name: Keepalive

# GitHub は「60日間リポジトリに活動がない」と scheduled workflow を自動停止する。
# 監視が黙って止まるのを防ぐため、月に1度だけコミットして活動を発生させる。
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m 'chore: keepalive' || exit 0
          git push
